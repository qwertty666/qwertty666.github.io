<!DOCTYPE html>
<html>
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>HELL OF CDFZ</title>
    <meta charset="utf-8">
    <script>
        // 检查登录状态，未登录则跳转回首页
        (function() {
            const AUTH_KEY = 'site_authenticated';
            if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
                window.location.href = '/login.html';
            }
        })();
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .nav {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            padding: 8px 16px;
        }
        .nav a:hover {
            background-color: #555;
            border-radius: 5px;
        }
        h1 {
            color: #ffcc00;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(5px);
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .card .caption {
            padding: 15px;
            color: #ddd;
            text-align: center;
        }
        hr {
            margin: 40px 0;
            border-color: #444;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffcc00;
            text-decoration: none;
        }
        footer {
            text-align: center;
            color: #666;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏（静态保留） ===== -->
    <div class="nav">
        <a href="/">首页</a>
        <a href="/about.html" style="color: white;">关于</a>
        <a href="/contact.html" style="color: white;">联系我们</a>
        <a href="/publish.html" style="color: white;">近期发布</a>
        <a href="/niutijin.html" style="color: white;">QYH专栏</a>
        <a href="/mystery.html" style="color: white;">神秘图片</a>
    </div>

    <!-- ===== 正文由 JS 动态渲染 ===== -->
    <div id="mainContent"></div>

    <!-- ===== 外部数据文件 ===== -->
    <script src="mystery-data.js"></script>

    <!-- ===== 渲染脚本 ===== -->
    <script>
        (function renderMystery() {
            const data = window.mysteryData;
            const container = document.getElementById('mainContent');

            if (!data) {
                container.innerHTML = '<p style="color:#ff6b6b;padding:20px;">⚠️ 数据加载失败，请检查 mystery-data.js 是否存在。</p>';
                return;
            }

            let html = '';

            // ---- 标题 ----
            html += `<h1>${data.title || '神秘图片'}</h1>`;

            // ---- 副标题 ----
            if (data.subtitle) {
                html += `<p class="subtitle">${data.subtitle}</p>`;
            }

            // ---- 图片卡片列表 ----
            if (data.images && Array.isArray(data.images)) {
                html += `<div class="gallery">`;
                data.images.forEach(item => {
                    html += `
                        <div class="card">
                            <img src="${item.src}" alt="${item.caption || '神秘图片'}" loading="lazy">
                            <div class="caption">${item.caption || ''}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            } else {
                html += `<p style="color:#aaa;text-align:center;">暂无图片，请稍后查看。</p>`;
            }

            // ---- 分割线 ----
            html += `<hr>`;

            // ---- 返回首页链接 ----
            html += `<a href="/" class="back-link">← 返回首页</a>`;

            // ---- 页脚 ----
            if (data.footer) {
                html += `<footer><p>${data.footer}</p></footer>`;
            }

            container.innerHTML = html;
        })();
    </script>

</body>
</html>
