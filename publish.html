<style>
#comment-app {

<script>
    // ===== 评论区 JavaScript =====
    (function() {
        const API_BASE = 'https://comment.de5.net'; // 替换为你的 Worker 域名

        const listEl = document.getElementById('comment-list');
        const loadBtn = document.getElementById('load-more-btn');
        const form = document.getElementById('comment-form');
        const nicknameInput = document.getElementById('nickname');
        const contentInput = document.getElementById('content');
        const msgEl = document.getElementById('form-message');

        let currentPage = 0;
        let hasMore = true;
        let isLoading = false;

        // 格式化时间（修正时区差）
function formatTime(iso) {
    // 后端返回的是 UTC 时间 "YYYY-MM-DD HH:MM:SS"
    // 替换空格为 T 并加上 Z，强制作为 UTC 时间解析
    const d = new Date(iso.replace(' ', 'T') + 'Z');
    return d.toLocaleString('zh-CN', { hour12: false });
}

        // 加载评论（追加或替换）
        async function loadComments(page, append = false) {
            if (isLoading) return;
            isLoading = true;
            loadBtn.textContent = '加载中...';
            try {
                const res = await fetch(`${API_BASE}/api/comments?page=${page}`);
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();

                if (!append) {
                    listEl.innerHTML = '';
                }

                if (data.comments.length === 0 && page === 0) {
                    listEl.innerHTML = '<p style="color:#8888aa; text-align:center; padding:20px 0;">暂无评论，来说两句吧~</p>';
                    hasMore = false;
                    loadBtn.style.display = 'none';
                    return;
                }

                data.comments.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'comment-item';
                    item.innerHTML = `
                        <div class="meta">
                            <span class="nickname">${escapeHtml(c.nickname)}</span>
                            <span class="time">${formatTime(c.created_at)}</span>
                        </div>
                        <div class="content">${escapeHtml(c.content)}</div>
                    `;
                    listEl.appendChild(item);
                });

                hasMore = data.hasMore;
                currentPage = page;
                if (hasMore) {
                    loadBtn.style.display = 'inline-block';
                    loadBtn.textContent = '查看更多评论';
                } else {
                    loadBtn.style.display = 'none';
                }
            } catch (e) {
                console.error(e);
                msgEl.textContent = '评论加载失败，请刷新重试';
            } finally {
                isLoading = false;
                if (hasMore) loadBtn.textContent = '查看更多评论';
            }
        }

        // 简易防 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 提交评论
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const nickname = nicknameInput.value.trim() || '热心的川大附中学子';
            const content = contentInput.value.trim();
            if (!content) {
                msgEl.textContent = '内容不能为空';
                return;
            }
            if (content.length > 500) {
                msgEl.textContent = '内容超过500字符限制';
                return;
            }

            msgEl.textContent = '提交中...';
            try {
                const res = await fetch(`${API_BASE}/api/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, content }),
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || '提交失败');
                }
                msgEl.textContent = '✅ 评论发布成功！';
                form.reset();
                // 重新加载第一页（最新评论在最前面）
                currentPage = 0;
                await loadComments(0, false);
            } catch (e) {
                msgEl.textContent = '❌ ' + e.message;
            }
        });

        // 加载更多
        loadBtn.addEventListener('click', function() {
            if (!isLoading && hasMore) {
                loadComments(currentPage + 1, true);
            }
        });

        // 初始加载第一页
        loadComments(0, false);
    })();
</script>


    <!-- ===== 页脚 ===== -->
    <div class="footer">

    <!-- ===== 1. 引入外部数据文件（与HTML同目录） ===== -->
    <script src="publish-data.js"></script>

    <!-- ===== 2. 渲染脚本 ===== -->
    <script>
        (function renderPublish() {
            const container = document.getElementById('publishList');
            if (!container) return;

            const data = window.publishData;
            if (!data || !Array.isArray(data)) {
                container.innerHTML = '<li style="padding:20px;color:#999;">暂无数据，请检查 publish-data.js 是否加载。</li>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                html += '<li>';

                // ---- 标题行 ----
                const linkUrl = item.link || '#';
                html += `
                    <div class="article-title">
                        <a href="${linkUrl}">${item.title}</a>
                        <span class="date">${item.date}</span>
                    </div>
                    <div class="summary">
                `;

                // ---- 根据类型渲染内容 ----
                if (item.type === 'video') {
                    html += `
                        <video controls preload="none"
                            poster="${item.poster || ''}"
                            loading="lazy"
                            style="width:100%; border-radius:12px;">
                            <source src="${item.src}" type="video/mp4">
                            你的浏览器不支持视频播放。
                        </video>
                    `;
                    if (item.description) html += `<p>${item.description}</p>`;
                    if (item.meta) html += `<p class="meta">${item.meta}</p>`;
                }
                else if (item.type === 'link') {
                    if (item.image) {
                        html += `<img src="${item.image}" alt="${item.title}" loading="lazy" style="width:100%; border-radius:12px;">`;
                    }
                    if (item.description) html += `<p>${item.description}</p>`;
                    html += `<a href="${item.link}" class="read-more">查看全部 →</a>`;
                }
                else if (item.type === 'article') {
                    if (item.image) {
                        html += `<img src="${item.image}" alt="配图" loading="lazy" style="width:100%; border-radius:12px;">`;
                    }
                    if (item.content) {
                        html += `<p>${item.content}</p>`;
                    } else if (item.summary) {
                        html += `<p>${item.summary}</p>`;
                    }
                    if (item.link && item.link !== '#') {
                        html += `<a href="${item.link}" class="read-more">阅读全文 →</a>`;
                    }
                    if (item.subDate) {
                        html += `<p class="meta" style="margin-top:6px;">📅 更新：${item.subDate}</p>`;
                    }
                }

                html += `</div></li>`;

                // ---- 分割线（除最后一项） ----
                if (index < data.length - 1) {
                    html += '<hr>';
                }
            });

            container.innerHTML = html;
        })();
    </script>

    <!-- ===== 搜索功能（使用 TreeWalker，避免破坏 DOM） ===== -->
    <script>
        function searchPage() {
            const input = document.getElementById('searchInput');
            const keyword = input.value.trim();
            if (!keyword) { alert('请输入搜索关键词'); return; }

            clearHighlights();
            const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escaped, 'gi');

            const walker = document.createTreeWalker(
                document.body,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: function(node) {
                        const parent = node.parentElement;
                        if (!parent) return NodeFilter.FILTER_REJECT;
                        const tag = parent.tagName.toLowerCase();
                        if (tag === 'style' || tag === 'script' || tag === 'mark') return NodeFilter.FILTER_REJECT;
                        if (parent.closest && parent.closest('#gitmentContainer')) return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                },
                false
            );

            let found = false;
            const nodes = [];
            let node;
            while ((node = walker.nextNode())) {
                if (regex.test(node.textContent)) {
                    nodes.push(node);
                    found = true;
                }
            }
            if (!found) { alert('未找到：「' + keyword + '」'); return; }

            nodes.forEach(textNode => {
                const parent = textNode.parentNode;
                const fragment = document.createDocumentFragment();
                const text = textNode.textContent;
                const re = new RegExp(escaped, 'gi');
                let lastIndex = 0, match;
                while ((match = re.exec(text)) !== null) {
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                    }
                    const mark = document.createElement('mark');
                    mark.textContent = match[0];
                    fragment.appendChild(mark);
                    lastIndex = re.lastIndex;
                }
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
                parent.replaceChild(fragment, textNode);
            });

            const firstMark = document.querySelector('mark');
            if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearHighlights() {
            document.querySelectorAll('mark').forEach(mark => {
                const parent = mark.parentNode;
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize();
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            clearHighlights();
        }

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); searchPage(); }
        });
    </script>
