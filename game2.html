<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
// 检查登录状态，未登录则跳转回首页
(function() {
    const AUTH_KEY = 'site_authenticated';
    if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
        window.location.href = '/';
    }
})();
</script>
    <title>打地鼠 · CDFC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-wrapper {
            background: #1a1f3a;
            border-radius: 30px;
            padding: 30px 25px 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            color: #00d4ff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            background: #0f1322;
            border-radius: 16px;
            padding: 12px 18px;
            margin-bottom: 20px;
            color: #c0c8e0;
            font-size: 18px;
            font-weight: 500;
        }
        .info span:first-child {
            color: #ffd700;
        }
        .info span:last-child {
            color: #ff6b6b;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 20px 0 25px;
        }
        .hole {
            background: radial-gradient(circle at 30% 30%, #3a2a1a, #1f140c);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.7), 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            position: relative;
            overflow: hidden;
        }
        .hole:active {
            transform: scale(0.95);
        }
        .hole img {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            transition: 0.08s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #2a2f4a;
            border: none;
            color: #e0e8f0;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(238, 90, 36, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .footer {
            margin-top: 18px;
            color: #5a6a8a;
            font-size: 13px;
        }
        .footer a {
            color: #00d4ff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<p>本站于2027年7月1日前已停止访问。</p>
</body>
</html>
