<!DOCTYPE html>
<html>
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>HELL OF CDFZ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 登录检查（保留内联，确保在页面渲染前执行） -->
    <script>
        (function() {
            const AUTH_KEY = 'site_authenticated';
            if (sessionStorage.getItem(AUTH_KEY) !== 'true') {
                window.location.href = '/login.html';
            }
        })();
    </script>

    <!-- 全局样式（保持不变） -->
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            background-color: #0a0e27;
            color: #e0e0e0;
        }
        .nav {
            background: linear-gradient(135deg, #1a1f3a, #0f1322);
            padding: 18px 30px;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .nav a {
            color: #a0a0c0;
            text-decoration: none;
            margin-right: 25px;
            padding: 8px 16px;
            transition: 0.3s;
        }
        .nav a:hover {
            color: #00d4ff !important;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #00d4ff;
            border-left: 4px solid #00d4ff;
            padding-left: 20px;
        }
        h2 {
            color: #00d4ff;
            margin-top: 30px;
        }
        p, li {
            color: #c0c0e0;
            line-height: 1.7;
        }
        img, video {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        hr {
            border-color: #2a2f4a;
        }
        a {
            color: #00d4ff;
        }

        /* 音乐控制器样式 */
        #music-controller {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            background: rgba(26, 31, 58, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #2a2f4a;
            border-radius: 60px;
            padding: 8px 16px 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            user-select: none;
        }
        #music-controller:hover {
            border-color: #00d4ff;
            box-shadow: 0 8px 40px rgba(0, 212, 255, 0.15);
        }
        #music-controller button {
            background: none;
            border: none;
            color: #c0c0e0;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 4px;
            line-height: 1;
            transition: 0.2s;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #music-controller button:hover {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
        }
        #music-controller input[type="range"] {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            background: #3a3f5a;
            border-radius: 4px;
            outline: none;
            transition: 0.2s;
        }
        #music-controller input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        #music-controller input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
        }
        #music-status {
            color: #8888aa;
            font-size: 11px;
            letter-spacing: 0.5px;
            min-width: 32px;
            text-align: center;
        }
        @media (max-width: 600px) {
            #music-controller {
                bottom: 16px;
                right: 16px;
                padding: 6px 12px 6px 10px;
                gap: 8px;
                border-radius: 40px;
            }
            #music-controller button {
                font-size: 20px;
                width: 30px;
                height: 30px;
            }
            #music-controller input[type="range"] {
                width: 50px;
            }
            #music-status {
                font-size: 10px;
                min-width: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 唯一根容器，所有内容由 app.js 动态渲染 -->
    <div id="app"></div>

    <!-- 引入外部 JS 文件（defer 确保 DOM 加载完成后执行） -->
    <script src="app.js" defer></script>
</body>
</html>
