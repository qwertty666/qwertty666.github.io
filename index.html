    <div style="padding: 0 20px 20px;">

    <!-- ========================================================== -->
    <!-- ===== 音乐播放器（保留） ===== -->
    <!-- ========================================================== -->
    <div id="music-controller">
        <button id="music-toggle" title="播放/暂停">▶</button>
        <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.5">
        <span id="music-status">加载中</span>
    </div>

    <!-- ========================================================== -->
    <!-- ===== 1. 引入外部数据文件 ===== -->
    <!-- ========================================================== -->
    <script src="index-data.js"></script>

    <!-- ========================================================== -->
    <!-- ===== 2. 渲染脚本（生成所有正文内容） ===== -->
    <!-- ========================================================== -->
    <script>
        (function renderFullPage() {
            const data = window.indexData;
            if (!data) {
                document.getElementById('mainContent').innerHTML = 
                    '<p style="color:#ff6b6b;padding:40px;">⚠️ 数据加载失败，请检查 index-data.js 是否存在。</p>';
                return;
            }

            let html = '';

            // ============================================================
            // 1. 公告区
            // ============================================================
            if (data.farewell) {
                html += `
                    <div class="farewell-box">
                        <div class="farewell-text">${data.farewell.text}</div>
                        <div class="farewell-image">
                            <img src="${data.farewell.image}" alt="暂别" loading="lazy">
                        </div>
                        <div class="farewell-footer">${data.farewell.footer}</div>
                    </div>
                    <hr>
                `;
            }

            // ============================================================
            // 2. 介绍文字
            // ============================================================
            if (data.intro && Array.isArray(data.intro)) {
                data.intro.forEach(item => {
                    html += `
                        <div class="intro-section">
                            <p><strong>${item.title}</strong></p>
                            <p>${item.content}</p>
                        </div>
                    `;
                });
                html += `<hr>`;
            }

            // ============================================================
            // 3. 横幅大图
            // ============================================================
            if (data.banner) {
                html += `
                    <div class="img-wrapper">
                        <img src="${data.banner.src}" alt="${data.banner.alt || '横幅图片'}" loading="lazy">
                    </div>
                `;
            }

            // ============================================================
            // 5. 正文插图（大图 + 说明文字）
            // ============================================================
            if (data.contentImages && Array.isArray(data.contentImages)) {
                data.contentImages.forEach(item => {
                    html += `
                        <div class="img-wrapper">
                            <img src="${item.src}" alt="${item.alt || ''}" loading="lazy">
                            ${item.caption ? `<p>${item.caption}</p>` : ''}
                        </div>
                    `;
                });
                html += `<hr>`;
            }

            // ============================================================
            // 7. 歌词
            // ============================================================
            if (data.lyrics) {
                const lines = data.lyrics.lines || [];
                html += `
                    <div class="lyrics-box">
                        <div class="lyrics-title">${data.lyrics.title || ''}</div>
                        <div class="lyrics-lines">${lines.join('\n')}</div>
                        ${data.lyrics.footer ? `<div class="lyrics-footer">${data.lyrics.footer}</div>` : ''}
                    </div>
                `;
            }

            // ============================================================
            // 注入到页面
            // ============================================================
            document.getElementById('mainContent').innerHTML = html;
        })();
    </script>

    <!-- ========================================================== -->
    <!-- ===== 3. 音乐播放器控制脚本（保持不变） ===== -->
    <!-- ========================================================== -->
    <script>
        (function() {
            const MUSIC_URL = 'https://res.cloudinary.com/dc6yzsom9/video/upload/f_mp3/AAA_g2vhev';
            const audio = new Audio(MUSIC_URL);
            audio.loop = true;
            audio.volume = 0.5;

            const toggleBtn = document.getElementById('music-toggle');
            const volumeSlider = document.getElementById('music-volume');
            const statusEl = document.getElementById('music-status');

            let isPlaying = false;
            let userInteracted = false;

            function playMusic() {
                audio.play().then(() => {
                    isPlaying = true;
                    toggleBtn.textContent = '⏸';
                    statusEl.textContent = '播放中';
                    statusEl.style.color = '#00d4ff';
                }).catch(() => {
                    statusEl.textContent = '点击任意处';
                    statusEl.style.color = '#ffcc00';
                    if (!userInteracted) {
                        const resume = function() {
                            audio.play().then(() => {
                                isPlaying = true;
                                toggleBtn.textContent = '⏸';
                                statusEl.textContent = '播放中';
                                statusEl.style.color = '#00d4ff';
                                userInteracted = true;
                            }).catch(() => {});
                            document.removeEventListener('click', resume);
                            document.removeEventListener('touchstart', resume);
                        };
                        document.addEventListener('click', resume);
                        document.addEventListener('touchstart', resume);
                        userInteracted = true;
                    }
                });
            }

            window.addEventListener('load', function() {
                statusEl.textContent = '加载中...';
                audio.load();
                setTimeout(playMusic, 300);
            });

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    toggleBtn.textContent = '▶';
                    statusEl.textContent = '已暂停';
                    statusEl.style.color = '#8888aa';
                } else {
                    playMusic();
                }
            });

            volumeSlider.addEventListener('input', function() {
                audio.volume = parseFloat(this.value);
            });

            audio.addEventListener('error', function() {
                statusEl.textContent = '🎵 加载失败';
                statusEl.style.color = '#ff6b6b';
                toggleBtn.textContent = '▶';
            });

            audio.addEventListener('canplay', function() {
                if (statusEl.textContent === '加载中...') {
                    statusEl.textContent = '准备就绪';
                }
            });
        })();
    </script>
