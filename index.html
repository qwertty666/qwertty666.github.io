<!DOCTYPE html>
<html>
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>HELL OF CDFZ</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device‑width,initial‑scale=1">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            background-color: #0a0e27;
            color: #e0e0e0;
        }
        .nav {
            background: linear-gradient(135deg, #1a1f3a, #0f1322);
            padding: 18px 30px;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
        }
        .nav a {
            color: #a0a0c0;
            text-decoration: none;
            margin-right: 25px;
            padding: 8px 16px;
            transition: 0.3s;
        }
        .nav a:hover, .nav a.active {
            color: #00d4ff !important;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #00d4ff;
            border-left: 4px solid #00d4ff;
            padding-left: 20px;
        }
        h2 {
            color: #00d4ff;
            margin-top: 30px;
        }
        p, li {
            color: #c0c0e0;
            line-height: 1.7;
        }
        img, video {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        hr {
            border-color: #2a2f4a;
        }
        a {
            color: #00d4ff;
        }
        /* 音乐控制器全部样式保留 */
        #music-controller {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            background: rgba(26, 31, 58, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #2a2f4a;
            border-radius: 60px;
            padding: 8px 16px 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            user-select: none;
        }
        #music-controller:hover {
            border-color: #00d4ff;
            box-shadow: 0 8px 40px rgba(0, 212, 255, 0.15);
        }
        #music-controller button {
            background: none;
            border: none;
            color: #c0c0e0;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 4px;
            line-height: 1;
            transition: 0.2s;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #music-controller button:hover {
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
        }
        #music-controller input[type="range"] {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            background: #3a3f5a;
            border-radius: 4px;
            outline: none;
            transition: 0.2s;
        }
        #music-controller input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        #music-controller input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00d4ff;
            cursor: pointer;
            border: none;
        }
        #music-status {
            color: #8888aa;
            font-size: 11px;
            letter-spacing: 0.5px;
            min-width: 32px;
            text-align: center;
        }
        @media (max-width: 600px) {
            #music-controller {
                bottom: 16px;
                right: 16px;
                padding: 6px 12px 6px 10px;
                gap: 8px;
                border-radius: 40px;
            }
            #music-controller button {
                font-size: 20px;
                width: 30px;
                height: 30px;
            }
            #music-controller input[type="range"] {
                width: 50px;
            }
            #music-status {
                font-size: 10px;
                min-width: 24px;
            }
        }
    </style>
    <!-- 登录校验最先执行，防止白屏泄露内容 -->
    <script src="./auth.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 悬浮音乐播放器，固定放在页面，不由动态渲染生成 -->
    <div id="music-controller">
        <button id="music-toggle" title="播放/暂停">▶</button>
        <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.5">
        <span id="music-status">加载中</span>
    </div>

    <!-- JS文件顺序不能乱：数据 → 渲染器 → 音乐脚本 -->
    <script src="./data-index.js"></script>
    <script src="./render.js"></script>
    <script>
        // 音乐播放器完整代码，原样保留
        (function() {
            const MUSIC_URL = 'https://res.cloudinary.com/dc6yzsom9/video/upload/f_mp3/情凭谁来定错对-谭咏麟_knkb6s.flac';
            const audio = new Audio(MUSIC_URL);
            audio.loop = true;
            audio.volume = 0.5;
            const toggleBtn = document.getElementById('music-toggle');
            const volumeSlider = document.getElementById('music-volume');
            const statusEl = document.getElementById('music-status');
            let isPlaying = false;
            let userInteracted = false;

            function playMusic() {
                audio.play().then(() => {
                    isPlaying = true;
                    toggleBtn.textContent = '⏸';
                    statusEl.textContent = '播放中';
                    statusEl.style.color = '#00d4ff';
                }).catch(err => {
                    console.log('⏳ 自动播放被拦截，等待用户交互...');
                    statusEl.textContent = '点击任意处';
                    statusEl.style.color = '#ffcc00';
                    if (!userInteracted) {
                        const resumeOnClick = function() {
                            audio.play().then(() => {
                                isPlaying = true;
                                toggleBtn.textContent = '⏸';
                                statusEl.textContent = '播放中';
                                statusEl.style.color = '#00d4ff';
                                userInteracted = true;
                            }).catch(e => console.warn('播放失败:', e));
                            document.removeEventListener('click', resumeOnClick);
                            document.removeEventListener('touchstart', resumeOnClick);
                        };
                        document.addEventListener('click', resumeOnClick);
                        document.addEventListener('touchstart', resumeOnClick);
                        userInteracted = true;
                    }
                });
            }
            window.addEventListener('load', function() {
                statusEl.textContent = '加载中...';
                audio.load();
                setTimeout(playMusic, 300);
            });
            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    toggleBtn.textContent = '▶';
                    statusEl.textContent = '已暂停';
                    statusEl.style.color = '#8888aa';
                } else {
                    playMusic();
                }
            });
            volumeSlider.addEventListener('input', function() {
                audio.volume = parseFloat(this.value);
            });
            audio.addEventListener('error', function() {
                statusEl.textContent = '🎵 加载失败';
                statusEl.style.color = '#ff6b6b';
                toggleBtn.textContent = '▶';
                console.error('❌ 音乐文件加载失败，请检查 MUSIC_URL 是否正确');
            });
            audio.addEventListener('canplay', function() {
                if (statusEl.textContent === '加载中...') {
                    statusEl.textContent = '准备就绪';
                }
            });
        })();
    </script>
</body>
</html>
