<!DOCTYPE html>
<html>
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>HELL OF CDFZ</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            background-color: #0a0e27;
            color: #e0e0e0;
        }
        .nav {
            background: linear-gradient(135deg, #1a1f3a, #0f1322);
            padding: 18px 30px;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
        }
        .nav a {
            color: #a0a0c0;
            text-decoration: none;
            margin-right: 25px;
            padding: 8px 16px;
            transition: 0.3s;
        }
        .nav a:hover, .nav a[style*="white"] {
            color: #00d4ff !important;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: #00d4ff;
            border-left: 4px solid #00d4ff;
            padding-left: 20px;
        }
        h2 {
            color: #00d4ff;
            margin-top: 30px;
        }
        p,
        li {
            color: #c0c0e0;
            line-height: 1.7;
        }
        img,
        video {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        hr {
            border-color: #2a2f4a;
        }
        a {
            color: #00d4ff;
        }
    </style>
    <script>
        // ============================================================
        // 后端验证系统 + 内容 Worker 动态加载（密码哈希版）
        // ============================================================

        (function() {
            // ---------- 配置 ----------
            const API_URL = 'https://api.cdfz.de5.net';
            const CONTENT_URL = 'https://content.cdfz.de5.net/content';
            // 密码 707522 的 SHA-256 哈希值（前端硬编码，不暴露明文）
            const PASSCODE_HASH = '858055bd0be68b68e0bd74cac415184ee4e39631fb14c00e7094a348702ad23b';

            const AUTH_KEY = 'site_authenticated';
            const AUTH_USER_KEY = 'site_username';

            // ---------- 辅助函数 ----------
            function isAuthenticated() {
                return sessionStorage.getItem(AUTH_KEY) === 'true';
            }

            function setAuthenticated(username) {
                sessionStorage.setItem(AUTH_KEY, 'true');
                sessionStorage.setItem(AUTH_USER_KEY, username);
            }

            function getLoggedInUser() {
                return sessionStorage.getItem(AUTH_USER_KEY);
            }

            // ---------- 显示欢迎信息 ----------
            function showWelcomeMessage(username) {
                const nameMap = {
                    '32': 'Fyh',
                    '33': 'Hxb',
                    '39': '站长',
                    '11': 'jlcy'
                };
                const displayName = nameMap[username] || username;
                const div = document.createElement('div');
                div.id = 'welcome-banner';
                div.innerHTML = `
                        <div style="
                            position: fixed;
                            top: 20px;
                            left: 50%;
                            transform: translateX(-50%);
                            background: linear-gradient(135deg, #667eea, #764ba2);
                            color: white;
                            padding: 12px 28px;
                            border-radius: 50px;
                            font-size: 18px;
                            font-weight: bold;
                            z-index: 9999;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                            animation: slideDown 0.5s ease;
                        ">
                            欢迎回来，${displayName}！
                        </div>
                        <style>
                            @keyframes slideDown {
                                0% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
                                100% { opacity: 1; transform: translateX(-50%) translateY(0); }
                            }
                        </style>
                    `;
                document.body.appendChild(div);
                setTimeout(() => {
                    const el = document.getElementById('welcome-banner');
                    if (el) el.remove();
                }, 3500);
            }

            // ---------- 动态加载内容 ----------
            async function loadContent() {
                const username = getLoggedInUser();
                if (!username) {
                    showLoginDialog();
                    return;
                }

                try {
                    const res = await fetch(CONTENT_URL + '?passcode=' + encodeURIComponent(PASSCODE_HASH), {
                        credentials: 'include'
                    });
                    if (!res.ok) {
                        if (res.status === 401) {
                            sessionStorage.removeItem(AUTH_KEY);
                            sessionStorage.removeItem(AUTH_USER_KEY);
                            showLoginDialog();
                            return;
                        }
                        throw new Error('加载失败');
                    }
                    const data = await res.json();
                    if (data.success && data.content) {
                        document.getElementById('app').innerHTML = data.content;
                        addLogoutButton();
                    } else {
                        document.getElementById('app').innerHTML = '<p style="color:#ff6b6b;">内容加载失败</p>';
                    }
                } catch (e) {
                    console.error(e);
                    document.getElementById('app').innerHTML = '<p style="color:#ff6b6b;">网络异常，请刷新</p>';
                }
            }

            // ---------- 退登按钮 ----------
            function addLogoutButton() {
                if (document.getElementById('logout-btn')) return;
                const btn = document.createElement('button');
                btn.id = 'logout-btn';
                btn.textContent = 'LOG OUT';
                btn.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        padding: 4px 12px;
                        background: #dc3545;
                        color: white;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 12px;
                        font-weight: bold;
                        z-index: 999;
                    `;
                btn.onclick = function() {
                    sessionStorage.removeItem(AUTH_KEY);
                    sessionStorage.removeItem(AUTH_USER_KEY);
                    document.getElementById('app').innerHTML = '';
                    showLoginDialog();
                };
                document.body.appendChild(btn);
            }

            // ---------- 显示登录对话框 ----------
            function showLoginDialog() {
                const overlay = document.createElement('div');
                overlay.id = 'login-overlay';
                overlay.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: black;
                        z-index: 99999;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        font-family: 'Segoe UI', Arial, sans-serif;
                    `;

                overlay.innerHTML = `
                        <div style="
                            background: #1a1a1a;
                            padding: 40px 30px;
                            border-radius: 16px;
                            max-width: 360px;
                            width: 90%;
                            box-shadow: 0 8px 30px rgba(255,255,255,0.08);
                            border: 1px solid #333;
                            text-align: center;
                        ">
                            <h2 style="color: white; margin: 0 0 8px 0;">LOG IN</h2>
                            <p style="color: #888; margin: 0 0 24px 0; font-size: 14px;">Please enter your account number and password.</p>
                            <input type="text" id="login-username" placeholder="帐号" style="width:100%; padding:12px; margin-bottom:14px; background:#2a2a2a; border:1px solid #444; border-radius:8px; color:white; font-size:16px; text-align:center; box-sizing:border-box;">
                            <input type="password" id="login-password" placeholder="密码" style="width:100%; padding:12px; margin-bottom:18px; background:#2a2a2a; border:1px solid #444; border-radius:8px; color:white; font-size:16px; text-align:center; box-sizing:border-box;">
                            <button id="login-submit" style="width:100%; padding:12px; background:#667eea; border:none; border-radius:8px; color:white; font-size:18px; font-weight:600; cursor:pointer; transition:background 0.2s;">GO</button>
                            <div id="login-error" style="color:#ff6b6b; margin-top:14px; font-size:14px; display:none;"></div>
                        </div>
                    `;

                document.body.appendChild(overlay);

                const usernameInput = document.getElementById('login-username');
                const passwordInput = document.getElementById('login-password');
                const submitBtn = document.getElementById('login-submit');
                const errorEl = document.getElementById('login-error');

                usernameInput.focus();

                async function doLogin() {
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    if (!username || !password) {
                        errorEl.textContent = 'Please enter your account number and password.';
                        errorEl.style.display = 'block';
                        return;
                    }

                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Verifying...';

                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });

                        const data = await response.json();

                        if (data.success) {
                            setAuthenticated(username);
                            overlay.remove();
                            await loadContent();
                            showWelcomeMessage(username);
                        } else {
                            errorEl.textContent = '❌ ' + data.message;
                            errorEl.style.display = 'block';
                            usernameInput.value = '';
                            passwordInput.value = '';
                            usernameInput.focus();
                        }
                    } catch (error) {
                        errorEl.textContent = '❌ The network is abnormal. Please try again later.';
                        errorEl.style.display = 'block';
                        console.error('登录请求失败:', error);
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'GO';
                    }
                }

                submitBtn.addEventListener('click', doLogin);

                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        doLogin();
                    }
                });

                usernameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        passwordInput.focus();
                    }
                });
            }

            // ---------- 退出登录 ----------
            window.logout = function() {
                sessionStorage.removeItem(AUTH_KEY);
                sessionStorage.removeItem(AUTH_USER_KEY);
                document.getElementById('app').innerHTML = '';
                showLoginDialog();
            };

            // ---------- 页面加载时检查登录状态 ----------
            if (!isAuthenticated()) {
                setTimeout(showLoginDialog, 100);
            } else {
                loadContent();
            }
        })();
    </script>
</head>
<body>
    <!-- 动态内容容器 -->
    <div id="app" style="max-width:1000px; margin:0 auto; padding:0; min-height:100vh;">
        <!-- 登录后由 Worker 动态填充 -->
    </div>
</body>
</html>
