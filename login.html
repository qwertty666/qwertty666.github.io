<!DOCTYPE html>
<html>
<head>
     <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest"> 
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>
    <style>
        body {
            margin: 0;
            background: #0a0e27;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #1a1a2e;
            padding: 40px 30px;
            border-radius: 16px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            color: #00d4ff;
            margin-bottom: 8px;
        }
        p {
            color: #8892b0;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background: #2a2a4a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #5a6fd6;
        }
        #login-error {
            color: #ff6b6b;
            margin-top: 14px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>LOG IN</h2>
        <p>Please enter your account number and password.</p>
        <input type="text" id="login-username" placeholder="帐号" autofocus>
        <input type="password" id="login-password" placeholder="密码">
        <button id="login-submit">GO</button>
        <div id="login-error"></div>
    </div>
    <script>
        (function() {
            const API_URL = 'https://api.cdfz.de5.net';
            const AUTH_KEY = 'site_authenticated';
            const AUTH_USER_KEY = 'site_username';

            const usernameInput = document.getElementById('login-username');
            const passwordInput = document.getElementById('login-password');
            const submitBtn = document.getElementById('login-submit');
            const errorEl = document.getElementById('login-error');

            if (sessionStorage.getItem(AUTH_KEY) === 'true') {
                window.location.href = '/';
                return;
            }

            async function doLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                if (!username || !password) {
                    errorEl.textContent = 'Please enter your account number and password.';
                    errorEl.style.display = 'block';
                    return;
                }
                submitBtn.disabled = true;
                submitBtn.textContent = 'Connecting...';
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await response.json();
                    if (data.success) {
                        sessionStorage.setItem(AUTH_KEY, 'true');
                        sessionStorage.setItem(AUTH_USER_KEY, username);
                        window.location.href = '/';
                    } else {
                        errorEl.textContent = '❌ ' + data.message;
                        errorEl.style.display = 'block';
                        usernameInput.value = '';
                        passwordInput.value = '';
                        usernameInput.focus();
                    }
                } catch (error) {
                    errorEl.textContent = '❌ The network is abnormal. Please try again later.';
                    errorEl.style.display = 'block';
                    console.error('登录请求失败:', error);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'GO';
                }
            }

            submitBtn.addEventListener('click', doLogin);
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') doLogin();
            });
            usernameInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') passwordInput.focus();
            });
        })();
    </script>
</body>
</html>
